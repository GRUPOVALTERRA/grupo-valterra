name: E2E smoke

# Smoke tests de superficie pública contra una URL desplegada.
# Manual (workflow_dispatch) para no acoplar cada push a un deploy externo.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base a testear"
        default: "https://grupo-valterra.vercel.app"
        required: true

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          CI: "true"
        run: npm run e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
